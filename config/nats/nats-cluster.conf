# Three servers; NATS_NAME comes from compose.yaml. Default sync_interval:
# durability comes from replicating each stream to a quorum of servers.
server_name: $NATS_NAME
port: 4222
http: 8222
jetstream {
  store_dir: /data
}
cluster {
  name: bench
  port: 6222
  routes: [
    nats://nats-1:6222
    nats://nats-2:6222
    nats://nats-3:6222
  ]
}
